[package]
name = "QuietAutoClicker"
description = "Modern auto clicker for Windows and Linux"
license = "GPL-3.0"
version = "1.0.0"
edition = "2021"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "std", "raw-window-handle-06", "unstable-winit-030"] }
enigo = "0.6.1"
rdev = { version = "0.5.3", features = ["unstable_grab"] }
fastrand = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "async-io"] }
async-io = "2.6.0"
futures = "0.3.34"
zbus = "5.19.0"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"

[build-dependencies]
slint-build = "1.18.1"
embed-resource = "3.0.12"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
